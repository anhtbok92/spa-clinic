<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Luxe Spa & Nail</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loader">
        <div class="loader-circle"></div>
        <p class="loader-text">Luxe Spa</p>
      </div>
    </div>

    <!-- Main Content - Pages rendered by JS -->
    <main id="main-content"></main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-item active" data-page="home">
        <i class="fas fa-home"></i>
        <span>Trang chủ</span>
      </button>
      <button class="nav-item" data-page="booking">
        <i class="fas fa-calendar-plus"></i>
        <span>Đặt lịch</span>
      </button>
      <button class="nav-item" data-page="my-bookings">
        <i class="fas fa-clock"></i>
        <span>Lịch của tôi</span>
      </button>
    </nav>

    <!-- Floating CTA Button -->
    <button id="fab-booking" class="fab-button" aria-label="Đặt lịch ngay">
      <i class="fas fa-plus"></i>
    </button>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/booking.js"></script>
  <script src="js/pages/my-bookings.js"></script>
</body>
</html>
